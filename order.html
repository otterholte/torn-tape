<title>Request an Edit | Torn Tape</title>

<style>
/* Layout: one centred "sketchbook page" card per step, progress tape across the top, sticky action bar at the bottom. */
:root {
  --ground: #0b1220;      /* the navy grade of the edits */
  --ground-2: #121b2e;
  --paper: #ecE8dc;       /* off-white torn paper */
  --paper-ink: #1a1d26;
  --muted: #8b97b0;
  --line: #2a3654;
  --red: #de3434;
  --yellow: #f7c420;
  --cyan: #28cde8;
  --f-marker: "Sedgwick Ave Display", "Permanent Marker", "Comic Sans MS", cursive;
  --f-hand: "Covered By Your Grace", "Bradley Hand", "Segoe Print", cursive;
  --f-body: "Archivo", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--paper);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  background-image: radial-gradient(1200px 600px at 80% -10%, #18264a 0%, transparent 60%);
}
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 120px; }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-marker); font-size: 30px; letter-spacing: 1px; color: var(--paper); line-height: 1; }
.brand span { color: var(--red); }
.proto { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
/* progress tape */
.tape { margin: 16px 0 18px; display: flex; gap: 4px; }
.tape i { flex: 1; height: 8px; background: var(--line); border-radius: 1px; transform: skewX(-12deg); transition: background .3s; }
.tape i.done { background: var(--yellow); }
.tape i.cur { background: var(--red); }
.steplabel { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
/* the card */
.card {
  background: var(--paper); color: var(--paper-ink); padding: 26px 22px 24px; position: relative;
  clip-path: polygon(0 1.2%, 6% 0, 13% 1%, 22% .2%, 31% 1.1%, 41% 0, 52% .9%, 63% .1%, 72% 1%, 84% 0, 93% 1.2%, 100% .3%, 100% 99%, 94% 100%, 85% 99.2%, 74% 100%, 63% 99.1%, 51% 100%, 40% 99.3%, 29% 100%, 18% 99%, 8% 100%, 0 99.2%);
  animation: drop .35s ease-out;
}
@keyframes drop { from { transform: translateY(14px) rotate(-.6deg); opacity: .4 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .card { animation: none } }
.card h1 { font-family: var(--f-marker); font-weight: 400; font-size: clamp(30px, 6vw, 44px); line-height: 1.05; margin: 0 0 6px; text-wrap: balance; color: var(--paper-ink); }
.card h1 em { font-style: normal; color: var(--red); }
.card .sub { font-family: var(--f-hand); font-size: 22px; line-height: 1.2; color: #3a3f4d; margin: 0 0 18px; }
.note { font-size: 13px; color: #5a6070; margin-top: 12px; }
/* option cards */
.opts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.opt { border: 2px solid #1a1d26; background: #fffdf6; padding: 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; display: flex; flex-direction: column; gap: 6px; position: relative; transition: transform .12s; }
.opt:hover { transform: rotate(-.6deg) translateY(-2px); }
.opt:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.opt.on { border-color: var(--red); box-shadow: 5px 5px 0 var(--red); }
.opt.on::after { content: "✓"; position: absolute; top: 8px; right: 10px; font-family: var(--f-marker); color: var(--red); font-size: 22px; }
.opt b { font-size: 16px; }
.opt .price { font-family: var(--f-hand); font-size: 22px; color: var(--red); line-height: 1; }
.opt small { color: #5a6070; font-size: 13px; }
.opt img { width: 100%; aspect-ratio: 560/238; object-fit: cover; display: block; border: 1px solid #1a1d26; background: #0b1220; }
.looks { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
/* inputs */
label.f { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; }
input[type=text], input[type=email], textarea, select {
  width: 100%; font: inherit; color: var(--paper-ink); background: #fffdf6; border: 2px solid #1a1d26; padding: 10px 12px; border-radius: 0;
}
textarea { min-height: 170px; font-family: var(--f-body); font-size: 15px; line-height: 1.5; resize: vertical; }
textarea.short { min-height: 90px; }
.lw { font: inherit; font-size: 15px; border: 0; background: transparent; padding: 3px 4px; cursor: pointer; color: #2a2f3c; border-radius: 2px; }
.lw:hover { background: #f4e9b8; }
.lw.on { background: var(--yellow); font-weight: 700; color: #1a1d26; }
.lw:focus-visible { outline: 2px solid var(--cyan); }
.mark { display: grid; grid-template-columns: minmax(90px, 160px) 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed #b9b3a3; }
.mark .w { font-weight: 700; overflow-wrap: anywhere; }
.mark button { font: inherit; font-size: 13px; border: 1.5px solid #1a1d26; background: #fffdf6; padding: 5px 9px; cursor: pointer; color: inherit; }
.lybox { border: 2px solid #1a1d26; background: #fffdf6; padding: 10px 12px; margin: 12px 0 4px; max-height: 360px; overflow-y: auto; }
.lybox .lyric { margin: 0; gap: 0; }
.lybox .ln { gap: 0 1px; margin: 0; line-height: 1.2; }
.lybox .lw { padding: 1px 3px; font-size: 15px; }
.lybox .gap { width: 100%; height: 8px; }
.gimg { width: 100%; aspect-ratio: 560 / 238; object-fit: cover; display: block; border: 1px solid #1a1d26; }
.grades { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)) !important; }
.or { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; font-weight: 700; font-size: 13px; color: #5a6070; }
.or::before, .or::after { content: ""; flex: 1; border-top: 1px dashed #b9b3a3; }
.okline { font-size: 13px; color: #2c6b2f; font-weight: 600; margin-top: 6px; }
.grades { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.sw { height: 54px; border: 1px solid #1a1d26; }
.policy { background: #fff3c4; border: 2px solid #1a1d26; padding: 12px 14px; margin-top: 14px; font-size: 14px; }
.policy label { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; font-weight: 600; cursor: pointer; }
.policy input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--red); }
@media (max-width: 520px) { .mark { grid-template-columns: 1fr auto; } .mark .w { grid-column: 1 / -1; } }
input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--cyan); outline-offset: 1px; }
.drop { border: 2px dashed #1a1d26; padding: 22px; text-align: center; background: #fffdf6; cursor: pointer; display: block; }
.drop strong { font-family: var(--f-marker); font-weight: 400; font-size: 22px; display: block; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.file { margin-top: 10px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.file .tag { background: var(--yellow); padding: 2px 8px; font-weight: 600; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { font: inherit; font-weight: 600; border: 2px solid #1a1d26; background: #fffdf6; padding: 8px 12px; cursor: pointer; color: inherit; }
.seg button.on { background: #1a1d26; color: var(--paper); }
/* word chips */
.lyric { display: flex; flex-wrap: wrap; gap: 6px 4px; margin-bottom: 10px; }
.lyric .ln { width: 100%; display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; }
.chip { font-family: var(--f-hand); font-size: 22px; line-height: 1; border: 0; background: transparent; padding: 4px 6px; cursor: pointer; color: #2a2f3c; }
.chip:hover { background: #f4e9b8; }
.chip.on { font-family: var(--f-marker); color: var(--red); background: #1a1d26; transform: rotate(-2deg); }
.chip:focus-visible { outline: 2px solid var(--cyan); }
.count { font-size: 13px; color: #5a6070; }
/* drawings */
.drow { display: grid; grid-template-columns: 140px 1fr; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px dashed #b9b3a3; }
.drow:last-child { border-bottom: 0; }
.drow .w { font-family: var(--f-marker); font-size: 24px; color: var(--red); overflow-wrap: anywhere; }
.drow .sug { font-size: 12px; color: #5a6070; }
.dpicks { display: flex; flex-wrap: wrap; gap: 6px; }
.dpicks button { font: inherit; font-size: 13px; border: 1.5px solid #1a1d26; background: #fffdf6; padding: 5px 9px; cursor: pointer; color: inherit; }
.dpicks button.on { background: var(--yellow); font-weight: 700; }
.examples { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.examples figure { margin: 0; }
.examples img { width: 100%; aspect-ratio: 560/238; object-fit: cover; display: block; border: 1px solid #1a1d26; }
.examples figcaption { font-family: var(--f-hand); font-size: 18px; text-align: center; }
/* preview */
.stills { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.stills figure { margin: 0; background: #1a1d26; padding: 6px 6px 8px; transform: rotate(var(--r, 0deg)); }
.stills img { width: 100%; display: block; aspect-ratio: 560/238; object-fit: cover; }
.stills figcaption { color: var(--paper); font-family: var(--f-hand); font-size: 18px; padding-top: 4px; }
/* summary */
.sum { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.sum td { padding: 8px 0; border-bottom: 1px dashed #b9b3a3; vertical-align: top; }
.sum td:last-child { text-align: right; white-space: nowrap; padding-left: 12px; }
.sum tr.total td { font-weight: 700; font-size: 18px; border-bottom: 0; }
.when { display: flex; gap: 10px; align-items: center; background: #1a1d26; color: var(--paper); padding: 10px 14px; margin-top: 12px; }
.when b { font-family: var(--f-marker); font-weight: 400; font-size: 20px; color: var(--yellow); }
pre.job { background: #1a1d26; color: #cfe7ff; padding: 12px; font-size: 12px; overflow-x: auto; max-height: 260px; }
/* bottom bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(11, 18, 32, .94); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); backdrop-filter: blur(6px); }
.bar .in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }
.bar .tot { margin-right: auto; font-size: 13px; color: var(--muted); }
.bar .tot b { color: var(--paper); font-size: 18px; font-variant-numeric: tabular-nums; }
.btn { font: inherit; font-weight: 700; border: 0; padding: 12px 18px; cursor: pointer; }
.btn.go { background: var(--red); color: #fff; box-shadow: 3px 3px 0 var(--yellow); }
.btn.go:disabled { background: #4a2a35; color: #a88; box-shadow: none; cursor: not-allowed; }
.btn.back { background: transparent; color: var(--paper); border: 1.5px solid var(--line); }
.btn:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.err { color: var(--red); font-weight: 600; font-size: 13px; margin-top: 8px; }
@media (max-width: 520px) {
  .drow { grid-template-columns: 1fr; gap: 6px; }
  .row2 { grid-template-columns: 1fr; }
  .examples { grid-template-columns: repeat(3, 1fr); }
  .card { padding: 22px 16px 20px; }
}
</style>

const SAMPLE = `Woke up with the city on my shoulders
Every light on the block getting colder
Kept the money in a shoebox under the bed
Lit a candle for the dreams I never said`;
const PRICE = 199, FULL = 249, RUSH = 25;
const FORM_ENDPOINT = "";   // e.g. https://formspree.io/f/xxxxxxx (empty = prototype, nothing is sent)
const ALLOW_FILE = false;            // public site: links only (form services can't carry big video files)
const CREDIT = "Edit & visuals: Torn Tape → [your Torn Tape link]";

const S = {
  file: "", link: "", extra: "", looks: new Set(LOOKS.map(l => l.id)),
  showLyrics: true, lyrics: SAMPLE,
  marks: {}, drawNote: "",
  grade: "keep", gradeNote: "",
  name: "", email: "", notes: "", rush: false, agree: false, creditAgree: true, step: 0,
};

function steps() {
  const s = ["upload", "looks", "lyrics", "drawings", "grade", "preview", "price", "checkout", "done"];
  return s;
}
const LABEL = { upload: "Your video", looks: "Looks", lyrics: "Lyrics", drawings: "Drawings", grade: "Colour", preview: "Preview", price: "Credit", checkout: "Send request", done: "Request sent" };
const base = () => S.creditAgree ? PRICE : FULL;
const total = () => base();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lines = () => S.lyrics.split(/\n/).map(l => l.split(/\s+/).filter(Boolean)).filter(l => l.length);

function render() {
  const st = steps(), key = st[S.step];
  document.getElementById("tape").innerHTML = st.map((_, i) => `<i class="${i < S.step ? "done" : i === S.step ? "cur" : ""}"></i>`).join("");
  document.getElementById("steplabel").textContent = key === "done" ? "Done" : `Step ${S.step + 1} of ${st.length - 1} · ${LABEL[key]}`;
  document.getElementById("screen").innerHTML = `<section class="card">${VIEWS[key]()}</section>`;
  document.getElementById("total").textContent = "$" + total();
  const back = document.getElementById("back"), next = document.getElementById("next");
  back.hidden = S.step === 0 || key === "done";
  next.textContent = key === "checkout" ? "Submit request" : key === "done" ? "Start another" : "Next";
  next.disabled = !valid(key);
  BIND[key] && BIND[key]();
}
function linkOk() { return /^https?:\/\/\S+\.\S+/.test(S.link.trim()); }
function valid(k) {
  if (k === "upload") return (ALLOW_FILE && !!S.file) || linkOk();
  if (k === "looks") return S.looks.size > 0;
  if (k === "lyrics") return !S.showLyrics || S.lyrics.trim().length > 0;
  if (k === "checkout") return !!(S.name.trim() && /.+@.+\..+/.test(S.email) && S.agree);
  return true;
}

const VIEWS = {
  upload: () => `

    ${S.file ? `<div class="file"><span class="tag">Ready</span> ${esc(S.file)}</div>` : `<div class="file"><button class="btn back" id="useSample" type="button" style="color:#1a1d26;border-color:#1a1d26">Use an example file</button></div>`}

    <p class="note">${S.looks.size} of ${LOOKS.length} looks on.</p>`,
  lyrics: () => `

    <p class="sub">In the real service these are stills from your own video, ready a few minutes after upload.</p>
    <div class="stills">
      ${shown.map((l, i) => `<figure style="--r:${[-1.2, .8, -.4, 1.1][i]}deg"><img src="${IMG[l.img]}" alt="${l.name} example"><figcaption>${l.name}</figcaption></figure>`).join("")}
    </div>
    <table class="sum" style="margin-top:14px">
      <tr><td>Looks</td><td>${S.looks.size} of ${LOOKS.length}</td></tr>
      <tr><td>Lyrics on screen</td><td>${S.showLyrics ? "Yes" : "No"}</td></tr>
      <tr><td>Drawings requested</td><td>${Object.keys(S.marks).length || (S.drawNote.trim() ? "see note" : "our pick")}</td></tr>
      <tr><td>Colour</td><td>${esc(g.name)}</td></tr>
    </table>
    <p class="note">Example frames from a sample edit.</p>`;
  },
  price: () => `
    <h1>Give credit, <em>save $${FULL - PRICE}</em></h1>
    <p class="sub">Credit Torn Tape on your video and pay $${PRICE} instead of $${FULL}.</p>
    <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:6px;font-weight:900;font-variant-numeric:lining-nums">
      <span style="font-size:${S.creditAgree ? 26 : 44}px;${S.creditAgree ? "color:#8b8577;text-decoration:line-through;text-decoration-color:#de3434;text-decoration-thickness:3px" : ""}">$${FULL}</span>
      ${S.creditAgree ? `<span style="font-size:44px">$${PRICE}</span>` : ""}
    </div>
    <div class="policy">
      <b>Paste this line into your video's description:</b>
      <pre class="job" style="margin:8px 0;white-space:pre-wrap;font-weight:700">${esc(CREDIT)}</pre>
      <button type="button" class="btn back" id="copyCredit" style="color:#1a1d26;border-color:#1a1d26;padding:6px 12px">Copy the line</button>
      <p style="margin:12px 0 0">On YouTube, put it in the first 10 lines, or next to your director and editor credits. On TikTok or Instagram, put it in the caption. Have it there from the day the video goes live, and keep it up.</p>
      <p style="margin:10px 0 0">We can also show your video and name you as an example on our website.</p>
      <label for="creditIn"><input id="creditIn" type="checkbox" ${S.creditAgree ? "checked" : ""}> I'll add the credit as shown, and Torn Tape can feature my video on its site. (Untick to pay $${FULL} with no credit.)</label>
    </div>`,
  checkout: () => `
    <h1>Send your <em>request</em></h1>
    <p class="sub">No payment yet. We review your video first.</p>
    <div class="row2">
      <div><label class="f" for="nameIn">Artist or name</label><input id="nameIn" type="text" value="${esc(S.name)}" autocomplete="name"></div>
      <div><label class="f" for="emailIn">Email</label><input id="emailIn" type="email" value="${esc(S.email)}" autocomplete="email"></div>
    </div>
    <label class="f" for="notesIn">Anything else we should know? (optional)</label>
    <input id="notesIn" type="text" value="${esc(S.notes)}">
    <div class="when">Delivery <b>3–5 business days</b></div>
    <table class="sum" style="margin-top:14px">
      <tr><td>Full video edit${S.creditAgree ? " (with credit)" : ""}</td><td>$${base()}</td></tr>
      <tr class="total"><td>Price if accepted</td><td>$${total()}</td></tr>
    </table>
    <div class="policy">
      <b>We review every video before we start.</b> Within 1 business day we'll email you a yes or no. If it's a yes, the email has a secure payment link, and work starts once you've paid.
      <p style="margin:6px 0 0;font-size:12px;font-style:italic;color:#5a6070">We don't take every project, sometimes due to the content requested or our current workload.</p>
      <p style="margin:8px 0 0">Once you've paid and we start work, all sales are final. Up to 2 rounds of edits are included.</p>
      <label for="agreeIn"><input id="agreeIn" type="checkbox" ${S.agree ? "checked" : ""}> I understand: I pay only if Torn Tape accepts my video, sales are final once work starts, 2 rounds of edits are included, and I own or am cleared for this music and footage.</label>
    </div>
    ${!valid("checkout") ? `<div class="err">${!S.name.trim() || !/.+@.+\..+/.test(S.email) ? "Add your name and a valid email." : "Tick the box to agree before placing the order."}</div>` : ""}`,
  done: () => {
    const job = {
      file: S.file || null, video_link: linkOk() ? S.link.trim() : null, other_files: S.extra.trim() || null, looks: [...S.looks],
      lyrics: { on_screen: S.showLyrics, text: S.lyrics.trim() ? "(provided)" : null },
      drawings: { words: Object.values(S.marks).map(m => m.note ? { word: m.w, note: m.note } : { word: m.w }), note: S.drawNote || null },
      grade: S.grade === "custom" ? { style: "custom", note: S.gradeNote } : S.grade,
      delivery: "3-5 business days",
      attribution: { credit: CREDIT, agreed: S.creditAgree, may_feature_on_site: S.creditAgree },
      revisions_included: 2, total_usd: total(), status: "awaiting review", payment: "send Stripe link if accepted",
    };
    return `
    <h1>Request <em>sent!</em></h1>
    <p class="sub">Thanks${S.name ? ", " + esc(S.name) : ""}. We'll review your video and email you within 1 business day.</p>
    <p class="note">You haven't been charged. If we accept it, the email includes your payment link.</p>
`;
  },
};
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const BIND = {
  upload: () => {
    if ($("#fileIn")) $("#fileIn").onchange = e => { const f = e.target.files[0]; if (f) { S.file = `${f.name} (${(f.size / 1048576).toFixed(1)} MB)`; render(); } };
    const us = $("#useSample"); if (us) us.onclick = () => { S.file = "my-new-single.mp4 (example)"; render(); };
    $("#linkIn").oninput = e => {
      S.link = e.target.value; $("#next").disabled = !valid("upload");
      $("#linkMsg").innerHTML = linkOk() ? `<div class="okline">Link added. Make sure anyone with the link can view it.</div>` : "";
    };
    $("#extraIn").oninput = e => S.extra = e.target.value;
  },
  looks: () => $$("[data-look]").forEach(b => b.onclick = () => { const id = b.dataset.look; S.looks.has(id) ? S.looks.delete(id) : S.looks.add(id); render(); }),
  lyrics: () => {
    const ta = $("#lyrIn");
    const grow = () => { ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 4) + "px"; };
    ta.oninput = e => { S.lyrics = e.target.value; S.marks = {}; $("#next").disabled = !valid("lyrics"); grow(); };
    ta.style.overflowY = "hidden"; grow();
    $$("[data-show]").forEach(b => b.onclick = () => { S.showLyrics = b.dataset.show === "yes"; render(); });
  },
  drawings: () => {
    $$("[data-k]").forEach(b => b.onclick = () => { const k = b.dataset.k; if (S.marks[k]) delete S.marks[k]; else S.marks[k] = { w: b.dataset.w, note: "" }; render(); });
    $$("[data-note]").forEach(i => i.oninput = e => { S.marks[i.dataset.note].note = e.target.value; });
    $$("[data-rm]").forEach(b => b.onclick = () => { delete S.marks[b.dataset.rm]; render(); });
    $("#drawNote").oninput = e => S.drawNote = e.target.value;
  },
  grade: () => {
    $$("[data-grade]").forEach(b => b.onclick = () => { S.grade = b.dataset.grade; render(); });
    const g = $("#gradeNote"); if (g) g.oninput = e => S.gradeNote = e.target.value;
  },
  price: () => {
    const c = $("#creditIn"); if (c) c.onchange = e => { S.creditAgree = e.target.checked; render(); };
    const cp = $("#copyCredit");
    if (cp) cp.onclick = () => {
      const done = () => { cp.textContent = "Copied"; };
      try { navigator.clipboard.writeText(CREDIT).then(done, () => { selectCredit(); }); } catch (e) { selectCredit(); }
    };
  },
  checkout: () => {
    const upd = () => { $("#next").disabled = !valid("checkout"); };
    $("#nameIn").oninput = e => { S.name = e.target.value; upd(); };
    $("#emailIn").oninput = e => { S.email = e.target.value; upd(); };
    $("#notesIn").oninput = e => S.notes = e.target.value;
    $("#agreeIn").onchange = e => { S.agree = e.target.checked; render(); };
  },
};
function selectCredit() { const p = document.querySelector(".policy pre"); if (!p) return; const r = document.createRange(); r.selectNodeContents(p); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
function requestPayload() {
  return {
    _subject: `New Torn Tape request: ${S.name || "no name"}`,
    name: S.name, email: S.email, notes: S.notes || "-",
    video_link: linkOk() ? S.link.trim() : "-", other_files: S.extra.trim() || "-",
    looks: LOOKS.filter(l => S.looks.has(l.id)).map(l => l.name).join(", "),
    lyrics_on_screen: S.showLyrics ? "yes" : "no", lyrics: S.lyrics.trim() || "-",
    drawings: Object.values(S.marks).map(m => m.w + (m.note ? ` (${m.note})` : "")).join("; ") || "our pick",
    drawing_notes: S.drawNote || "-",
    colour: (GRADES.find(g => g.id === S.grade) || {}).name + (S.grade === "custom" && S.gradeNote ? `: ${S.gradeNote}` : ""),
    credit_and_feature: S.creditAgree ? "yes" : "no", price_if_accepted: "$" + total(),
  };
}
async function submitRequest() {
  const btn = $("#next");
  if (!FORM_ENDPOINT || FORM_ENDPOINT.indexOf("{{") === 0) {
    if (ALLOW_FILE) return true;                                             // prototype: nothing to send
    const card = document.querySelector(".card");                            // public site without an inbox yet: never pretend it sent
    if (card && !card.querySelector(".senderr")) card.insertAdjacentHTML("beforeend", `<div class="err senderr">Requests open very soon. Please check back shortly.</div>`);
    return false;
  }
  btn.disabled = true; btn.textContent = "Sending...";
  try {
    const r = await fetch(FORM_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json", "Accept": "application/json" }, body: JSON.stringify(requestPayload()) });
    if (!r.ok) throw new Error("status " + r.status);
    return true;
  } catch (e) {
    btn.disabled = false; btn.textContent = "Submit request";
    const card = document.querySelector(".card");
    if (card && !card.querySelector(".senderr")) card.insertAdjacentHTML("beforeend", `<div class="err senderr">Your request didn't send. Check your connection and tap Submit request again.</div>`);
    return false;
  }
}
$("#next").onclick = async () => {
  const st = steps();
  if (st[S.step] === "checkout" && !(await submitRequest())) return;
  if (st[S.step] === "done") { Object.assign(S, { step: 0, file: "", link: "", extra: "", name: "", email: "", notes: "", rush: false, agree: false, marks: {} }); }
  else S.step = Math.min(st.length - 1, S.step + 1);
  render(); window.scrollTo({ top: 0, behavior: "smooth" });
};
$("#back").onclick = () => { S.step = Math.max(0, S.step - 1); render(); window.scrollTo({ top: 0 }); };
render();
</script>

</html>
